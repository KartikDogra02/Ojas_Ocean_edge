name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://localhost:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4

      # A one-node replica set, because the app uses transactions. (Service containers can't pass
      # --replSet, so Mongo is started here instead.)
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 30); do
            docker exec mongo mongosh --quiet --eval "
              try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }
              quit(db.hello().isWritablePrimary ? 0 : 1)" && exit 0
            sleep 2
          done
          echo "MongoDB didn't become primary" && exit 1

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest
