services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      # Root user is created only when the data volume is first initialised.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    # Single-node replica set, so the API can use transactions. With authentication on, replica set members need a
    # shared key file; it's generated once into its own volume.
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /data/keyfile/mongo.key ]; then
          head -c 756 /dev/urandom | base64 > /data/keyfile/mongo.key
        fi
        chmod 400 /data/keyfile/mongo.key
        chown 999:999 /data/keyfile/mongo.key
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/keyfile/mongo.key --bind_ip_all
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/data/keyfile
    # Healthy once this node is the writable primary; on the very first start it also initiates the replica set.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval
          "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) };
          print(db.hello().isWritablePrimary)" | grep -q true
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  api:
    build: .
    ports:
      - "8000:8000"
    # Every setting in .env reaches the API; the values below override it for Docker.
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin&replicaSet=rs0
      MONGO_DB: ${MONGO_DB:-ojas_ocean_edge}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      mongo:
        condition: service_healthy

  # Optional local stand-in for R2 (S3-compatible SeaweedFS): docker compose --profile s3 up -d
  # Then set STORAGE_BACKEND=r2, R2_ENDPOINT=http://s3:8333, R2_BUCKET=ojas-dev and any R2 keys (not checked locally).
  s3:
    image: chrislusf/seaweedfs:latest
    profiles: ["s3"]
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3_data:/data

volumes:
  mongo_data:
  mongo_keyfile:
  s3_data:
