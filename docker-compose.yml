services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      # Root user is created only when the data volume is first initialised.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    # Every setting in .env reaches the API; the values below override it for Docker.
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-ojas_ocean_edge}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      mongo:
        condition: service_healthy

  # Optional local stand-in for R2 (S3-compatible SeaweedFS): docker compose --profile s3 up -d
  # Then set STORAGE_BACKEND=r2, R2_ENDPOINT=http://s3:8333, R2_BUCKET=ojas-dev and any R2 keys (not checked locally).
  s3:
    image: chrislusf/seaweedfs:latest
    profiles: ["s3"]
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3_data:/data

volumes:
  mongo_data:
  s3_data:
