[project]
name = "ojas-ocean-edge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pymongo>=4.10",
    "pydantic-settings>=2.6",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "boto3>=1.43.111",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "S", "ASYNC", "I"]
ignore = [
    "UP040",  # keep `X: TypeAlias = Annotated[...]`; PEP 695 `type` aliases change how Pydantic/FastAPI read them
    "B008",   # FastAPI's Depends()/Query() in argument defaults is intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fixed test passwords are fine in tests

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
